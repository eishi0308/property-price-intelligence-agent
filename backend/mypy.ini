# Type checking is deliberately at mypy's default strictness, not --strict: the
# goal is to catch the class of defect that actually shipped here (a keyword
# collision that made a node crash, an optional dereferenced without a guard),
# not to annotate every dict in the codebase.
[mypy]
python_version = 3.11
# app/api/routes.py imports `scripts.check_property_data`, while the scripts
# themselves are also checked directly. Without an explicit package base mypy
# maps that one file to two module names and refuses to continue.
mypy_path = .
explicit_package_bases = True

# pgvector and langchain-mcp-adapters ship no py.typed marker, so their public
# API is untyped upstream and there is nothing to check against. Scoped per
# module rather than set globally, so a NEW untyped dependency still surfaces
# instead of being silently swallowed.
[mypy-pgvector.*]
ignore_missing_imports = True

[mypy-langchain_mcp_adapters.*]
ignore_missing_imports = True
