[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# The DB engine's connection pool and the MCP session-owner task are bound to the
# loop that created them. Fixtures and tests must therefore share ONE loop, or a
# session-scoped fixture hands a test resources belonging to a dead loop and the
# suite deadlocks rather than failing.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# No -q here: combined with a -q on the command line it becomes -qq, which
# suppresses the pass/fail summary and makes CI output useless.
addopts = --strict-markers
markers =
    unit: pure logic, no I/O
    integration: requires PostgreSQL with pgvector and a seeded demo corpus
    ai: exercises the LLM/embedding-backed components and their offline fallbacks
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
