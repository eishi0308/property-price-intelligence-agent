name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, evals)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector must exist before the schema is applied, so use the extension image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: property_intel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/property_intel
      PROPERTY_PROVIDER: demo
      LOG_LEVEL: WARNING
      # No LLM or property-data credentials in CI. The suite runs against the
      # documented offline path, which is exactly what we want verified: the
      # project must be buildable and testable by anyone, with no paid keys.

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and format check
        run: |
          ruff check app scripts evals tests
          ruff format --check app scripts evals tests

      - name: Verify fixtures and golden dataset are reproducible
        # Both are generated deterministically and committed; a diff here means
        # someone edited a generated file by hand.
        run: |
          python scripts/generate_fixtures.py
          python scripts/build_golden_dataset.py
          git diff --exit-code app/providers/fixtures evals/golden

      - name: Seed database and build the semantic index
        run: |
          python scripts/seed_demo_data.py --reset
          python scripts/build_embeddings.py

      - name: Data feasibility gate
        run: python scripts/check_property_data.py

      - name: Tests
        run: python -m pytest tests -q

      - name: Evaluations
        # Exits non-zero if groundedness or agent behaviour regresses.
        run: python -m evals.run --json eval-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval-report.json

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
